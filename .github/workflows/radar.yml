name: radar

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours, off the busy :00 slot
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the filters before publishing anything
        run: python -m unittest discover -s tests -v

      - name: Scrape and rebuild the feed
        run: python radar.py

      - name: Commit if the feed changed
        run: |
          git config user.name  "ottawa-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md state.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "radar: update feed"
            git push
          fi
